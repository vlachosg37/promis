# Default PROMIS configuration for hg38 WES/WGS input.
# WGS input is recommended at >30x coverage; adjust depth-sensitive thresholds
# only after validating them for your cohort.
preset: wes-wgs-hg38
repeats: database/MSI_loci_hg38_coordinates_metadata_exonic_chr_rem_artefacts.csv  # Bundled hg38 MSI loci.
scripts_dir: scripts  # Bundled PROMIS analysis scripts.
reference_genome: ""  # Required only for CRAM input; leave empty for BAM input.
container_image: "docker://ghcr.io/vlachosg37/promis:latest"  # Used only with Apptainer/Singularity deployment.

# Output directory for generated reports and tables.
output_dir: results/promis

# Input alignments. Provide either:
# - alignment_files: a YAML list, or a comma-and-space-separated string such as
#   "/data/sample_1.bam, /data/sample_2.bam"
# - input_dir: directory scanned recursively for BAM/CRAM files
alignment_files: []
input_dir: ""

# Read extraction and quality thresholds.
min_reads: 5  # Minimum deduplicated reads per locus during extraction
min_dev_reads: 5  # Minimum deviating reads to call instability at a locus
msi_deviation: 0.1  # Minimum fraction of repeat-length shift to consider deviating
bq_threshold: 20  # Minimum base quality for included reads
mq_threshold: 40  # Minimum mapping quality for included reads

# Instability calling logic. The final sample score is the percentage of
# unstable evaluable loci. Samples with no evaluable loci are QC failures.
call_by: both  # "both" means min_dev_reads AND min_dev_percent must pass
min_dev_percent: 10.0  # Minimum percentage of deviating reads for instability
min_length_percent: 20.0  # Minimum percent difference from reference length
use_GMM: true  # Fit a Gaussian Mixture Model to refine stable repeat length
balance_tolerance: 0.05  # Allowed imbalance between GMM components
min_total_reads: 50  # Minimum total reads per locus required for scoring
