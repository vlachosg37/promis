# PROMIS preset for the TSO500 hg19 targeted panel.
preset: tso500-hg19
repeats: database/TSO500_hg19_sites_bed.csv  # Bundled TSO500 hg19 MSI loci.
scripts_dir: scripts  # Bundled PROMIS analysis scripts.
reference_genome: ""  # Required only for CRAM input; leave empty for BAM input.
output_dir: results/promis  # Directory for PROMIS tables and run metadata.
# Explicit BAM/CRAM files. A comma-and-space-separated string also works, e.g.:
# alignment_files: "/data/sample_1.bam, /data/sample_2.bam"
alignment_files: []  # Leave empty when using input_dir.
input_dir: ""  # Directory scanned recursively for BAM/CRAM files.
msi_deviation: 0.1  # Read-level repeat-length shift used during repeat analysis.
min_reads: 5  # Minimum deduplicated reads retained at an MSI locus.
min_dev_reads: 5  # Minimum deviating reads required to call a locus unstable.
bq_threshold: 60  # Minimum mean base quality for retained reads.
mq_threshold: 59  # Minimum mapping quality for retained reads.
call_by: both  # Require both the read-count and percentage criteria.
min_dev_percent: 10.0  # Minimum percentage of deviating reads at a locus.
min_length_percent: 20.0  # Minimum repeat-length difference from the stable length.
use_GMM: true  # Use Gaussian-mixture refinement of the stable repeat length.
balance_tolerance: 0.05  # Allowed imbalance between GMM components.
min_total_reads: 50  # Minimum reads required for a locus to be evaluable.
